#
# los-tv: initrd is fixed-size 16 MiB (step45, bootable/aaropa/Android.mk).
# make-ab pre-creates the per-slot files with this size, and the "ota" module
# copies the ISO image with `dd conv=notrunc`, which never shrinks the target.
# Keep this equal to INITRD_FIXED_SIZE, otherwise the installed
# initrd_a/b.img end up larger than the initrd partition in the OTA payload.

make-ab:
  - file: "system.img"
    size: 8192
  - file: "kernel"
    size: 20
  - file: "initrd.img"
    size: 16
  - file: "recovery.img"
    size: 64
