# los-tv: kmsg log toggle (stored in grubenv, default on).
if [ "$KMSGLOG" = "1" ]; then set MKMSG="[x]"; else set MKMSG="[ ]"; fi
menuentry "$MKMSG kmsg-лог (нажми, чтобы переключить)" --class android --class os {
	if [ "$KMSGLOG" = "1" ]; then
		set KMSGLOG=0
	else
		set KMSGLOG=1
	fi
	save_env KMSGLOG
	configfile $prefix/kmsglog-menu.cfg
}
menuentry "<- назад в главное меню" --class android --class os {
	configfile $prefix/grub.cfg
}
