# los-tv: содержимое подменю «Разрешение экрана» (подключается из grub.cfg).
# В GRUB нет виджетов, поэтому «радиокнопки» и «галочка» — часть заголовка
# пункта. Файл перечитывается (configfile) после каждого выбора, чтобы отметки
# перерисовались сразу и остались в подменю (проверено в песочнице).
if [ "$TVRES" = "1080p" ]; then set M1080="[*]"; else set M1080="[ ]"; fi
if [ "$TVRES" = "720p" ]; then set M720="[*]"; else set M720="[ ]"; fi
if [ "$PHYSRES" = "1" ]; then set MPHYS="[x]"; else set MPHYS="[ ]"; fi

menuentry "$M1080 1080p (плотность 320)" --class android --class os {
	set TVRES=1080p
	configfile $prefix/tvres-menu.cfg
}
menuentry "$M720 720p (плотность 213)" --class android --class os {
	set TVRES=720p
	configfile $prefix/tvres-menu.cfg
}
menuentry "$MPHYS менять и физический режим ТВ" --class android --class os {
	if [ "$PHYSRES" = "1" ]; then set PHYSRES=0; else set PHYSRES=1; fi
	configfile $prefix/tvres-menu.cfg
}
menuentry "<- назад в главное меню" --class android --class os {
	configfile $prefix/grub.cfg
}
